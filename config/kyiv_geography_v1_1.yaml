dictionary_version: kyiv-geography-v1.1
status: provisional_human_validation_required
scope: Small Kyiv locality and nearby-settlement dictionary, not an exhaustive gazetteer.
normalization: Same reversible lowercase/dash/apostrophe mapping as threat dictionary.
resolution:
  overlap: Longest specific locality span wins; nested shorter aliases are suppressed.
  anchor: Generic or shared names require explicit Kyiv or another unambiguous city locality; no inference from
    channel or alert interval.
  mixed_geographies: Keep uncertain; do not infer direction or destination.
  suburbs: kyiv_region, never Kyiv City.
localities:
- locality_id: kyiv_city
  canonical_name: Київ
  locality_type: city
  category: explicit_kyiv
  requires_kyiv_anchor: false
  patterns:
  - (?<!\w)(?:ки(?:їв|єв(?:а|і|у|ом))|киев(?:а|е|у|ом)?)(?!\w)(?!\s*(?:обл\w*|регіон\w*))
  - (?<!\w)столиц(?:я|і|ю|ею)(?!\w)
  note: City reference; neither actual destination nor confirmed threat.
- locality_id: kyiv_oblast
  canonical_name: Київська область
  locality_type: administrative_oblast
  category: kyiv_region
  requires_kyiv_anchor: false
  patterns:
  - (?<!\w)(?:київщин(?:а|и|і|у|ою)|київськ(?:а|ої|ій|у|ою)\s+област(?:ь|і|ю)|київ\s+обл)(?!\w)
  note: Oblast is distinct from City.
