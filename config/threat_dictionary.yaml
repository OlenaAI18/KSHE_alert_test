context_rules:
  negated_or_cancelled:
  - \bвідбій\b
  - \bскасован\w*
  - \bзагроз\w*\s+(?:немає|нема|не\s+(?:нес\w*|станов\w*))
  - \bне\s+(?:загрож\w*|нес\w*\s+загроз\w*|підтверд\w*)
  - \bбез\s+загроз\w*
  - \b(?:повернув\w*|поверта\w*|приземли\w*|сіли|сів)\b
  - \bне\s+(?:на|до|над)\s+(?:київ|києв\w*|столиц\w*)\b
  historical_or_summary:
  - \b(?:вчора|учора|минул\w*|підсум\w*|статистик\w*|зведення|за\s+(?:добу|ніч|тиждень)|було\s+(?:збито|знищено)|збили|знищили)\b
  uncertain:
  - \b(?:ймовір\w*|можливо|схоже|непідтвердж\w*|чутки|якщо|походу|начебто|нібито|можлив\w*)\b
  - \b(?:носій|носіями|носієм|є\s+носі\w*|експертиз\w*|характеристик\w*)\b
  - \?
  - \bрозвідувальн\w*
  - \b(?:ніби|потенційн\w*|можуть|сподіва\w*|нагніта\w*)\b
  explicit_alert_cause:
  - \bтривог\w*[^\n.!?]{0,90}\b(?:через|пов.язан\w*\s+(?:з|із)|спричинен\w*)\b
  - \bпричин\w*\s+тривог\w*
  current_threat:
  - \b(?:загроз\w*|небезпек\w*|зліт|зльот\w*|підйом|підня\w*|активніст\w*|активност\w*|в\s+повітрі|у\s+повітрі|рух\w*|курс\w*|лет\w*|прям\w*|наближ\w*|пуск\w*|запуск\w*|напрям\w*|вектор\w*)\b
  - \b(?:на|до|над)\s+(?:ки(?:їв|єв(?:а|і|у|ом))|столиц(?:я|і|ю|ею))\b
  - \bки(?:їв|єв(?:а|і|у|ом))\s*[-,:!]\s*(?:балістик\w*|шахед\w*|ракет\w*|бпла)\b
geography_rules:
  explicit_kyiv:
  - \bки(?:їв|єв(?:а|і|у|ом))\b(?!\s*(?:обл\w*|регіон\w*))
  - \bстолиц(?:я|і|ю|ею)\b
  kyiv_region:
  - \bкиївщин\w*
  - \bкиївськ\w*\s+(?:обл\w*|регіон\w*)
  - \bкиїв\s+обл\w*
  nationwide:
  - \bпо\s+(?:всій\s+)?(?:україні|країні)\b
  - \bвс\w*\s+україн\w*
  - \bвсі\s+області\b
  - \bзагальнонаціональн\w*
  other_region:
  - \b(?:харків\w*|одес\w*|сумщин\w*|сумськ\w*|чернігів\w*|полтав\w*|черкас\w*|вінниц\w*|віннич\w*|житомир\w*|херсон\w*|миколаїв\w*|дніпр\w*|запорі\w*|львів\w*|кропивни\w*|крим\w*|бориспі\w*|бровар\w*|фастів\w*|білоцерк\w*)\b
aggregation:
  accepted_contexts:
  - current_threat
  - explicit_alert_cause
  accepted_geographies:
  - explicit_kyiv
  - nationwide
  unspecified_geography_policy: review_only
  generic_uav_policy: other:generic_uav; never infer shahed model
  jet_overlap_policy: highest priority wins on overlapping spans; separate non-overlapping mentions retained
  generic_overlap_policy: Suppress generic UAV/missile candidates when a corresponding specific family occurs in
    the same clause; retain suppressed evidence for review.
launch_negation_patterns:
- \bбез\s+пуск\w*
- \bпуск\w*\s+(?:немає|нема|не\s+було)
- \bне\s+було\s+пуск\w*
