[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyiv-air-alert-analysis"
version = "0.1.0"
description = "Reproducible research on historical Kyiv air raid alert time series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5", "pyarrow>=16", "tzdata>=2024.1", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.5,<1.9", "openpyxl>=3.1,<3.2"]
review = ["openpyxl>=3.1,<3.2"]
analysis = ["scikit-learn>=1.5,<1.9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kyiv_alerts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
